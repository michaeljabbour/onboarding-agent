<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>The Climb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="climbStyle">
:root{
  color-scheme:light; --paper:#f8f5eb; --sheet:#fffdf8; --ink:#25332f; --ink-2:#535e57; --rule:#dedbd0; --rule-2:#aaa99e;
  --indigo:#354e72; --indigo-wash:#e7eef6; --moss:#365f79; --moss-wash:#e7eff5; --shu:#a44631; --shu-wash:#f9e9e1;
  --ridge-1:#e7efeb; --ridge-2:#ccdcd3; --ridge-3:#a2beb1;
  --f-display:"Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --paper:#18211f; --sheet:#202d29; --ink:#eff6f1; --ink-2:#b5c4bb; --rule:#374840; --rule-2:#73877b;
  --indigo:#9ad9c4; --indigo-wash:#263c34; --moss:#aecfe3; --moss-wash:#253540; --shu:#f3aa91; --shu-wash:#432f29;
  --ridge-1:#25332e; --ridge-2:#34473f; --ridge-3:#476054; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(34px,5vw,52px);letter-spacing:-.01em;max-width:22ch}
h2{font-size:26px} h3{font-size:20px}
p{margin:0}
a{color:var(--indigo);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:3px}
.label{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
code{font-family:var(--f-mono);font-size:.86em;background:var(--indigo-wash);padding:1px 6px;border-radius:2px;overflow-wrap:anywhere}
kbd{font-family:var(--f-mono);font-size:.8em;border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:3px;padding:0 5px;background:var(--sheet);white-space:nowrap}
.term{background:none;border:0;padding:0;border-bottom:1px dotted var(--ink-2);cursor:help}
.btn{background:var(--ink);color:var(--sheet);border:1px solid var(--ink);border-radius:2px;padding:9px 18px;font-size:14px;letter-spacing:.03em}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.quiet{background:none;border:0;padding:0;color:var(--indigo);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:not(.quiet):not(:disabled):hover{background:var(--indigo);border-color:var(--indigo);color:var(--sheet)}

/* Frame */
#climb{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100dvh;overflow-y:auto;border-right:1px solid var(--rule);
  padding:36px 26px 26px max(26px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:26px}
.brand{font-family:var(--f-display);font-size:24px;text-decoration:none;color:var(--ink);display:block;line-height:1.1}
.who{font-size:13.5px;color:var(--ink-2);display:grid;gap:2px}
.who b{color:var(--ink);font-weight:500;font-size:15px}
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--rule-2)}
.path a{display:grid;grid-template-columns:11px 1fr;gap:16px;align-items:baseline;padding:8px 0;text-decoration:none;color:var(--ink-2);position:relative}
.path .dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--rule-2);background:var(--paper);position:relative;top:1px}
.path a.done .dot{background:var(--ink);border-color:var(--ink)}
.path a.here{color:var(--ink)}
.path a.here .dot{background:var(--shu);border-color:var(--shu)}
.path .nm{font-family:var(--f-display);font-size:17px;line-height:1.25}
.path .ct{display:block;font-family:var(--f-body);font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.refs{display:grid;gap:6px;font-size:14px}
.refs a{color:var(--ink-2);text-decoration:none} .refs a.here,.refs a:hover{color:var(--ink)}
.rail-foot{margin-top:auto;display:grid;gap:12px;font-size:13px;color:var(--ink-2)}
.alt-bar{height:2px;background:var(--rule);position:relative}
.alt-fill{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.agent-line{display:flex;gap:8px;align-items:center}
.led{width:7px;height:7px;border-radius:50%;border:1px solid var(--rule-2);flex:none}
.on .led{background:var(--moss);border-color:var(--moss)}
.menu-btn{display:none}
.view{min-width:0;max-width:860px;width:100%;margin:0 auto;padding-block:72px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:900px){.view{padding-left:56px;padding-right:56px}}
@media (max-width:899px){
  #climb{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;max-height:100dvh;border-right:0;border-bottom:1px solid var(--rule);background:var(--paper);
    padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));gap:0;display:grid;grid-template-columns:1fr auto;align-items:center}
  .rail>:not(.brand):not(.menu-btn){display:none}
  .rail.open{gap:18px;padding-bottom:20px}
  .rail.open>:not(.brand):not(.menu-btn){display:grid;grid-column:1/-1}
  .rail.open>.path{display:block}
  .brand{font-size:20px}
  .menu-btn{display:block;background:none;border:0;font-size:13px;letter-spacing:.04em;color:var(--ink-2)}
  .view{padding-block:36px 100px}
}

/* Stage head */
.stage-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 28px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--ink);margin-bottom:30px}
.numeral{font-family:var(--f-display);font-size:clamp(64px,10vw,104px);line-height:.82;color:var(--rule-2);letter-spacing:-.02em}
.stage-head .label{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.seal{display:inline-grid;place-items:center;width:26px;height:26px;background:var(--shu);color:var(--sheet);font-family:var(--f-display);font-size:13px;border-radius:3px;border-radius:50%;letter-spacing:0}
.lead{font-size:18px;max-width:62ch}
.prose{display:grid;gap:16px;max-width:66ch}
.block{margin-top:44px;display:grid;gap:18px}
.block>h2{font-size:22px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:24px;min-width:0}
.figure{overflow-x:auto}
.figure svg{display:block;min-width:660px;width:100%;height:auto}
.figure text{font-family:var(--f-body)}
.figure text:not([fill]){fill:var(--ink)}
.figcap{font-size:13.5px;color:var(--ink-2);margin-top:10px;max-width:70ch}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:64px;padding-top:20px;border-top:1px solid var(--rule);font-size:15px;flex-wrap:wrap}
.pager a{text-decoration:none;color:var(--ink)} .pager small{display:block;color:var(--ink-2);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* Steps */
.steps{border-top:1px solid var(--ink)}
.step{border-bottom:1px solid var(--rule);min-width:0}
.step-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start;width:100%;text-align:left;background:none;border:0;padding:18px 0}
.box{width:18px;height:18px;border:1px solid var(--ink);display:grid;place-items:center;margin-top:5px;flex:none}
.box svg{width:12px;height:12px;opacity:0}
.step.done .box{background:var(--moss);border-color:var(--moss)} .step.done .box svg{opacity:1}
.step-title{font-family:var(--f-display);font-size:20px;line-height:1.3;display:block}
.step-sub{font-size:14.5px;color:var(--ink-2);display:block}
.step-meta{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap;margin-top:7px;display:grid;gap:2px;justify-items:end}
.tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--rule-2);padding:1px 6px;border-radius:2px}
.step-body{display:grid;gap:20px;padding:4px 0 30px 34px;min-width:0}
.step.open{border-bottom-color:var(--ink)}
.step.open .step-head{padding-bottom:10px}
.why{max-width:64ch}
.part{display:grid;gap:10px;min-width:0}
.part>.label{display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:13.5px;color:var(--ink-2)} .hint.ok{color:var(--moss)}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--ink-2);letter-spacing:.03em}
.field-error{font-size:13px;color:var(--shu)}
input[type=text][aria-invalid=true]{border-color:var(--shu)}
input[type=text],textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule-2);border-radius:2px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical;line-height:1.5}
details.fold{border-left:1px solid var(--rule-2);padding-left:16px;min-width:0}
details.fold>summary{cursor:pointer;list-style:none;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);padding:2px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:" +";font-family:var(--f-mono)}
details.fold[open]>summary::after{content:" −"}
.fold-body{display:grid;gap:12px;padding:10px 0 4px;font-size:15px;min-width:0}
.fold-body ol,.fold-body ul{margin:0;padding-left:20px;display:grid;gap:8px;min-width:0}
.fold-body li{min-width:0;padding-left:2px}
.cmd{display:flex;gap:8px;align-items:stretch;margin-top:6px;min-width:0}
.cmd pre{flex:1 1 0;min-width:0;margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--indigo-wash);border:1px solid var(--rule);padding:9px 12px;overflow-x:auto;white-space:pre}
.cmd.say pre{white-space:pre-wrap;background:var(--sheet);border-left:2px solid var(--indigo);font-family:var(--f-body);font-size:14.5px}
@media (max-width:640px){.step-body{padding-left:0}.step-meta .xp{display:none}}

/* Agent thread */
.thread{border-left:1px solid var(--indigo);padding-left:16px;display:grid;gap:8px;min-width:0}
.th-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.status{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--indigo)}
.status.done{color:var(--moss)} .status.failed,.status.cancelled,.status.needs_you{color:var(--shu)}
.events{display:grid;gap:5px;max-height:420px;overflow-y:auto;padding-right:6px;min-width:0}
.ev{font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.ev.do{color:var(--ink-2);display:grid;grid-template-columns:16px minmax(0,1fr)}
.ev.do::before{content:"→";color:var(--indigo)}
.ev.do .c{display:block;font-family:var(--f-mono);font-size:12px;opacity:.8}
.ev.warn{color:var(--shu);font-size:13.5px}
.ev.fact{color:var(--moss)}
.ev.note{border-left:2px solid var(--rule-2);padding-left:10px}
.ev.you{background:var(--indigo-wash);padding:8px 12px;margin:4px 0 4px 24px;border-radius:2px}
.ev.you::before{content:"You  ";font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.ev.action,.ev.question{background:var(--shu-wash);border-left:2px solid var(--shu);padding:9px 12px}
.ev.action::before{content:"Needs you";display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--shu);margin-bottom:2px}
.ev.question::before{content:"The agent asks";display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--shu);margin-bottom:2px}
.ev pre{margin:4px 0;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;background:var(--sheet);border:1px solid var(--rule);padding:8px 10px;overflow-x:auto}
.ev.li{padding-left:16px;text-indent:-12px}
.sum{font-family:var(--f-display);font-size:18px;line-height:1.4;max-width:60ch}
.spin{width:10px;height:10px;border:1px solid var(--rule-2);border-top-color:var(--indigo);border-radius:50%;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Parallel example */
.lanes{display:grid;gap:10px;max-width:520px}
.lane{display:grid;gap:5px;font-size:13.5px;color:var(--ink-2)}
.lane i{display:block;height:3px;background:var(--rule);position:relative;overflow:hidden}
.lane i::after{content:"";position:absolute;inset:0;background:var(--indigo);transform-origin:left;animation:lane 6s linear infinite;animation-duration:inherit}
@keyframes lane{0%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}
.par{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:20px;min-width:0}
.par>div{display:grid;gap:8px;align-content:start;min-width:0}
.par .events{max-height:280px}
.choice>span{display:block}.choice small{display:block;font-size:14px;color:var(--ink-2)}

/* Laptop report */
.report{display:grid;gap:16px}
.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0 40px}
.chk{display:grid;grid-template-columns:14px minmax(0,1fr);gap:0 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.chk .m{width:9px;height:9px;border:1px solid var(--rule-2);border-radius:50%;position:relative;top:1px}
.chk.ok .m{background:var(--moss);border-color:var(--moss)}
.chk small{grid-column:2;color:var(--ink-2);font-size:12.5px;overflow-wrap:anywhere}

/* Judgment calls */
.calls{display:grid;gap:18px}
.call{display:grid;gap:10px}
.call .q{font-family:var(--f-display);font-size:19px;line-height:1.35;max-width:58ch}
.opts{border-top:1px solid var(--rule)}
.opt{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 2px;font-size:15px}
.opt::before{content:"";width:10px;height:10px;border:1px solid var(--rule-2);border-radius:50%;position:relative;top:1px}
.opt:hover{background:var(--sheet)}
.opt.right::before{background:var(--moss);border-color:var(--moss)} .opt.wrong::before{background:var(--shu);border-color:var(--shu)}
.fb{font-size:14.5px;max-width:64ch;min-height:1.4em} .fb.ok{color:var(--moss)} .fb.no{color:var(--shu)}

/* Manners, words, playbook */
.dl{display:grid;border-top:1px solid var(--rule)}
.dl>div{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:8px 24px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.dl dt{font-family:var(--f-display);font-size:17px;margin:0} .dl dd{margin:0;font-size:15px}
@media (max-width:560px){.dl>div{grid-template-columns:minmax(0,1fr)}}
.move{display:grid;gap:8px;padding:20px 0;border-bottom:1px solid var(--rule);min-width:0}
.move h3{font-size:19px}
.group-title{margin-top:44px;padding-bottom:10px;border-bottom:1px solid var(--ink)}

/* Interview and brief */
.hero{display:grid;gap:22px}
.hero .lead{max-width:54ch}
.hero svg{display:block;width:100%;height:auto;margin-top:8px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:0 36px;margin-top:8px}
.three div{border-top:1px solid var(--ink);padding:14px 0 6px;display:grid;gap:4px;align-content:start}
.three b{font-family:var(--f-display);font-weight:400;font-size:19px}
.three span{font-size:14.5px;color:var(--ink-2)}
.ask-wrap{max-width:640px;display:grid;gap:26px}
.qprog{display:flex;gap:14px;align-items:center}
.qprog .alt-bar{flex:1}
.qh{font-family:var(--f-display);font-size:clamp(28px,4.4vw,40px);line-height:1.18}
.choices{border-top:1px solid var(--ink)}
.choice{display:grid;grid-template-columns:18px minmax(0,1fr);gap:14px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:15px 2px;font-size:17px}
.choice::before{content:"";width:12px;height:12px;border:1px solid var(--ink);border-radius:50%;position:relative;top:1px}
.choice.multi::before{border-radius:1px}
.choice.sel::before{background:var(--ink)}
.choice:hover{background:var(--sheet)}
.brief{display:grid;gap:10px}
.brief li{font-family:var(--f-display);font-size:17.5px;line-height:1.45}
.brief ul{margin:0;padding-left:20px;display:grid;gap:6px}
.route{display:grid;border-top:1px solid var(--ink)}
.route a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.route .n{font-family:var(--f-display);font-size:22px;color:var(--rule-2)}
.route .t{font-family:var(--f-display);font-size:19px}
.route small{color:var(--ink-2);font-size:13px;text-align:right}

.pop{position:absolute;z-index:40;max-width:300px;background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:2px;font-size:14px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.pop b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:2px;font-size:14px;transition:transform .3s,opacity .3s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .mono{opacity:.7;margin-left:8px}
/* The companion stays small until invited into the conversation. */
.setup-note{display:grid;gap:10px;padding:18px 20px;margin-bottom:30px;border-left:3px solid var(--indigo);background:var(--sheet);font-size:14px}
.setup-note h2{font-size:21px}.setup-note p{max-width:62ch}.setup-note .row{gap:10px}
.companion-launcher{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));z-index:35;display:flex;align-items:center;gap:10px;min-height:54px;padding:7px 15px 7px 7px;border:1px solid var(--rule-2);border-radius:28px;background:var(--sheet);color:var(--ink);font:inherit;font-size:14px;box-shadow:0 4px 20px #0002}
.companion-launcher:hover{border-color:var(--indigo);transform:translateY(-2px)}
.companion-face{position:relative;display:inline-block;flex:none;width:38px;height:38px;border-radius:50% 50% 44% 44%;background:var(--indigo);color:var(--sheet);transform:rotate(-5deg)}
.companion-face::before{content:"";position:absolute;top:14px;left:11px;width:4px;height:6px;border-radius:2px;background:currentColor;box-shadow:12px 0 currentColor}
.companion-face::after{content:"";position:absolute;left:15px;top:24px;width:8px;height:3px;border-bottom:1.5px solid currentColor;border-radius:50%}
.companion-launcher .led{margin-left:3px}.companion-launcher[data-ready=true] .led{background:var(--moss);border-color:var(--moss)}
.companion-panel{
  position:fixed;inset:auto 16px 16px auto;z-index:45;width:min(382px,calc(100vw - 32px));
  height:min(536px,calc(100dvh - 32px));max-width:none;max-height:none;margin:0;padding:0;
  overflow:hidden;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);
  border-radius:20px;box-shadow:0 8px 32px #25332f1a;
}
.companion-panel[open]{display:flex;flex-direction:column}
.companion-launcher[aria-expanded=true]{visibility:hidden}
.companion-header{display:flex;align-items:center;gap:10px;flex:none;margin:0 20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.companion-header>div{flex:1;min-width:0}

  .studio-foot .btn,.studio-foot>a{min-height:44px;display:inline-flex;align-items:center}
  #view:has(.studio) > .setup-note{padding:14px}
}
/* Practice navigation and readable diagrams at narrow widths */
.overview-labs{margin-top:22px;border-top:1px solid var(--rule)}
.overview-labs>summary,.lesson-menu>summary{cursor:pointer;color:var(--indigo);font-weight:600}
.overview-labs>summary{padding:14px 0}
.lab-directory{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(225px,100%),1fr));gap:18px 24px;padding:10px 0}
.lab-directory h2{font-size:17px;margin:0 0 6px}
.lesson-menu{position:relative}
.lesson-menu>summary{padding:8px 0}
.lesson-menu .lesson-links{position:absolute;z-index:6;right:0;top:100%;width:min(290px,85vw);max-height:55dvh;overflow:auto;padding:8px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);box-shadow:0 8px 22px #25332f18;text-align:left;white-space:normal}
.lesson-menu .lesson-links a{display:block;padding:7px 0}
.release-stops{list-style:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0;padding:0}
.release-stops li{display:flex;flex-direction:column;gap:5px;padding:10px 8px;border-top:3px solid var(--rule-2);font-size:14px;line-height:1.4}
.release-stops small{font-size:14px;color:var(--ink-2)}
.release-stops strong,.planning-sequence strong{display:block;font-size:16px}
.release-stops .review-stop{border-color:var(--indigo);background:var(--indigo-wash)}
@media(min-width:721px){.planning-sequence{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);padding:0;margin:0}}
@media(max-width:720px){
  .release-stops{grid-template-columns:1fr;gap:4px}
  .release-stops li{display:grid;grid-template-columns:auto 1fr;column-gap:12px;border-top:0;border-inline-start:3px solid var(--rule-2);padding:6px 10px}
  .release-stops li>span{grid-column:2}
  .release-stops .review-stop{border-color:var(--indigo)}
  .planning-diagram svg{display:none}
  .planning-sequence{display:grid;gap:14px;padding-left:1.4em;margin:0;font-size:15px;line-height:1.5}
}
@media(max-width:600px){.lesson-stops a{flex:0 0 24px;min-width:24px}}
@media(min-width:561px) and (max-width:1366px){
  .companion-panel:modal,.in-lesson .companion-panel:modal{inset:0;margin:auto;width:min(520px,calc(100vw - 48px));height:min(624px,calc(100dvh - 64px))}
  .companion-panel::backdrop{background:color-mix(in srgb,var(--ink) 30%,transparent)}
}
@media (pointer:coarse) and (max-width:899px){
  .menu-btn,.chat-close,.chat-send,.chat-source,.practice-command button{min-height:44px;min-width:44px}
  .lesson-stops{flex-wrap:wrap;justify-content:center}
  .lesson-stops a{flex:0 0 44px}
  .studio-top{grid-template-columns:1fr 1fr}
  .studio-top .lesson-stops{grid-column:1/-1;grid-row:2}
  .studio-top>span{grid-column:2;grid-row:1}
  .in-lesson .companion-launcher{bottom:max(8px,env(safe-area-inset-bottom))}
  .companion-panel{padding-inline:env(safe-area-inset-left) env(safe-area-inset-right)}
  input[type=text],textarea{font-size:max(16px,1em)}
}
@media (pointer:coarse) and (max-width:899px) and (max-height:480px){
  .companion-panel:modal,.in-lesson .companion-panel:modal{inset:0;margin:auto;width:min(100%,640px);height:100dvh}
  .companion-header{padding-block:4px}
  .companion-compose{padding-top:2px}
}
@media(max-width:899px){
  .in-lesson .lesson-top,.studio .studio-top{display:grid;grid-template-columns:max-content minmax(0,1fr) auto;gap:0 8px;padding-block:4px}
  .in-lesson .lesson-top>a,.studio .studio-top>a{grid-area:1/1;min-height:44px;display:inline-flex;align-items:center}
  .in-lesson .lesson-top>.lesson-count,.studio .studio-top>span{grid-area:1/2;text-align:right}
  .in-lesson .lesson-top .lesson-stops,.studio .studio-top .lesson-stops{grid-area:2/1/auto/-1;justify-self:center}
  .lesson-top #companionLauncher,.studio-top #companionLauncher{grid-area:1/3;position:static;transform:none;min-width:44px;min-height:44px;padding:3px;justify-content:center;border:0;background:transparent;box-shadow:none}
  .lesson-top #companionLauncher::after,.studio-top #companionLauncher::after{content:"Chat";font-size:13px;font-weight:600}
  .lesson-top #companionLauncher,.studio-top #companionLauncher{gap:4px}
  .lesson-top #companionLauncher>span:not(.companion-face),.studio-top #companionLauncher>span:not(.companion-face){display:none}
  .in-lesson .lesson-turn{padding-bottom:max(14px,env(safe-area-inset-bottom));flex-wrap:wrap}
  .in-lesson .lesson-turn .btn{max-width:55%;padding-inline:6px}
}
.studio .studio-top{position:sticky;top:0;z-index:5;background:var(--paper)}
.studio .setup-path{display:flex;align-items:center;gap:12px;grid-area:1/1}
.setup-path a{display:inline-flex;align-items:center;min-height:44px}
.setup-path a+a::before{content:"/";margin-right:12px;color:var(--ink-2)}
#stage-connection .answer-notice{margin:0;padding:14px 0;border:0;border-top:1px solid var(--rule);border-radius:0;background:transparent}
.answer-notice h2{font-size:17px;font-weight:600}
.studio-top,.studio-page,.studio-foot{scroll-margin-top:60px}
@media(max-width:900px){.studio .setup-path{gap:7px}.setup-path a+a::before{margin-right:7px}.studio :is(input,button,a,summary){scroll-margin-top:108px}}
/* One frame for lessons, setup steps and stage steps: path left, progress centre, contents right. */
.studio-top>.lesson-count{justify-self:end}
.lesson-top .setup-path{display:flex;align-items:center;gap:12px;grid-area:1/1;justify-self:start;min-width:0}
.lesson-top .setup-path a,.studio-top .setup-path a{text-decoration:none;font-weight:600;white-space:nowrap}
.setup-path a:last-child{overflow:hidden;text-overflow:ellipsis}
.studio-top .lesson-menu>summary,.lesson-top .lesson-menu>summary{min-height:44px;display:inline-flex;align-items:center;padding:0}
@media(max-width:899px){.studio .studio-top>.lesson-count{grid-area:1/2;justify-self:end}.lesson-top .setup-path{gap:7px}}
@media(max-width:520px){.setup-path a:first-child{display:none}.setup-path a+a::before{content:"←";margin-right:6px}}
/* Chat sits bottom right on every wide page; on framed narrow pages it is in the top bar. */
@media(min-width:900px){.in-lesson .companion-launcher{left:auto;right:max(20px,env(safe-area-inset-right));transform:none;bottom:calc(92px + env(safe-area-inset-bottom))}.in-lesson .companion-launcher:hover{transform:translateY(-2px)}}
.step-list .setup-item span{display:grid;gap:2px}.step-list .setup-item b{font-weight:600}.step-list .setup-item em{font-style:normal;font-size:14px;color:var(--ink-2)}.step-list .setup-item small{white-space:nowrap}
.step-list .setup-optional{margin-top:22px}
.task-studio .studio-instruction{color:var(--ink-2);margin:4px 0 22px}
.feedback textarea{width:100%;font:14px/1.5 Menlo,ui-monospace,monospace;min-height:280px}
.ev.fact{color:var(--ink-2)}
</style>
</head>

const any=(v,...l)=>l.includes(v);
// The learner's own idea stays in guide state. The shared brief is a fixed list of fields.
const ideaText=v=>String(v==null?"":v).replace(/[\u0000-\u001f\u007f`<>]/g," ").replace(/\s+/g," ").trim().slice(0,200);
function ideaName(idea){
  const skip="a an the of to for my i me we our that which where when can could would should each every last first one small simple little page app site tool thing with and or in on at it is so keep track day days date".split(" ");
  const words=idea.toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(w=>w.length>2&&!skip.includes(w)).slice(0,3);
  return words.join("-").slice(0,40)||"first-project";
}
// The folder the connected agent reported, shown with ~ for the home folder; ~/dev before it connects.
const projectFolder=p=>{
  const name=p.repo?p.repo.split("/")[1]:"your-project", dir=String(AGENT.info?.workdir||"").replace(/^\/(?:Users|home)\/[^/]+(?=\/|$)/,"~");
  return (/^[~/][A-Za-z0-9_.\/~-]*$/.test(dir)?dir:"~/dev")+"/"+name;
};
// The order a learner sets up in. Optional steps stay reachable from All steps.
const SETUP_PATH=["tools","github","pick","newrepo","askadd","invite","clone","project","aboutme","desktop","shadow","gdocs"];
function nextSetup(after){
  const ids=SETUP_PATH.filter(id=>S[id]&&tier(S[id])==="core"), open=id=>!state.done[id];
  return ids.slice(ids.indexOf(after)+1).find(open)||ids.find(id=>id!==after&&open(id))||"";
}
function nextSetupLink(after){
  const id=nextSetup(after);
  const unfinished=after&&S[after]&&tier(S[after])==="core"&&!state.done[after];
  return id?el("a",{class:unfinished?"btn ghost":"btn",href:"#laptop/step-"+id},(unfinished?"Skip to: ":"Next: ")+esc(S[id].title)+" →"):el("a",{class:"btn",href:"#first"},"Setup is done. Start your first conversation →");
}
const builds=p=>any(p.role,"dev","pm")||any(p.goal,"plan","build");
const isNew=()=>!state.useTeamProject;
// Working alone on a new project: no reviewer has been named, so review steps are theirs to do.
const solo=p=>isNew()&&!p.buddy;
const S={}; const step=(id,o)=>{S[id]=Object.assign({id,xp:30,tier:()=>"core"},o);};

function setupReturnRoute(hash){

function cleanTransfer(raw){
  if(!raw||typeof raw!=="object"||raw.v!==1)throw new Error("That saved-answer link is not recognised.");
  const draft=raw.draft&&typeof raw.draft==="object"?raw.draft:{}, cleaned=climbClean(draft), partial={};
  Object.keys(cleaned).forEach(k=>{if(Object.prototype.hasOwnProperty.call(draft,k))partial[k]=cleaned[k];});
  if(ideaText(draft.build))partial.build=ideaText(draft.build);
  const done={},calls={};
  Object.keys(S).forEach(k=>{if(raw.done&&raw.done[k]===true)done[k]=true;});
  if(raw.calls?.directionsApplied===true)calls.directionsApplied=true;
  CALLS.forEach(c=>{if(raw.calls&&raw.calls[c.id]===true)calls[c.id]=true;});
  return {returnTo:setupReturnRoute(raw.returnTo),profile:raw.profile&&typeof raw.profile==="object"?climbClean(raw.profile):null,draft:partial,qi:Number.isInteger(raw.qi)?Math.min(QUESTIONS.length-1,Math.max(0,raw.qi)):0,done,calls,courseRepo:repoValue(raw.courseRepo||""),useTeamProject:raw.useTeamProject===true,kind:["new","existing"].includes(raw.kind)?raw.kind:"",idea:ideaText(raw.idea)};
}
function connectedGuideUrl(){
  const payload={v:1,returnTo:location.hash,profile:state.profile?climbClean(state.profile):null,draft:state.draft||{},qi:state.qi,done:state.done,calls:state.calls,kind:state.kind,courseRepo:state.courseRepo||"",useTeamProject:!!state.useTeamProject,idea:state.idea||ideaText(state.draft?.build)};
  const clean={v:1,...cleanTransfer(payload)}, encoded=encodeURIComponent(JSON.stringify(clean));
  return "http://localhost:4747/"+(encoded.length<=24000?"#climb-import="+encoded:"#laptop");
}
function applyTransfer(saved){
  const scope="climb-companion-"+crypto.randomUUID();
  const {returnTo,...answers}=saved;
  Object.assign(state,answers,{open:{},last:"laptop",chatScope:scope,intentWorkshop:{}});save();pendingImport=null;
  transferNotice="Your saved answers are here.";
  const target=returnTo||(state.profile?"#laptop":Object.keys(state.draft).length?"#interview":"#start");
  history.replaceState(null,"",target);
  location.reload();
}
function receiveTransfer(){
  if(!isLocal||!location.hash.startsWith("#climb-import="))return;
  COMP.open=false;saveCompanion();if($("#companionPanel")?.open)toggleCompanion(false);
  const encoded=location.hash.slice(14);
  history.replaceState(null,"",state.profile?"#laptop":"#start");
  try{
    if(encoded.length>24000)throw new Error("That saved-answer link is too large.");
    const text=decodeURIComponent(encoded);if(text.length>10000)throw new Error("That saved-answer link is too large.");
    const saved=cleanTransfer(JSON.parse(text));
    const mine=state.profile||Object.keys(state.draft||{}).length,empty=!saved.profile&&!Object.keys(saved.draft).length;
    const same=saved.profile&&state.profile&&JSON.stringify(saved.profile)===JSON.stringify(climbClean(state.profile));
    // A file copy with no answers, or the same answers, has nothing to choose between: keep this browser's and go to the step.
    if(mine&&(empty||same)){if(saved.returnTo)history.replaceState(null,"",saved.returnTo);}
    else if(mine)pendingImport=saved;
    else applyTransfer(saved);
  }catch(e){transferNotice="Your existing answers are safe. "+e.message;}
}

}
const linkify=h=>h.replace(/(https:\/\/[^\s<)"']+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
let toastT;
function toast(html){const t=$("#toast");t.innerHTML=html;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2800);}
function copyText(text,btn){
  const done=()=>{if(btn){const t=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=t,1400);}};
  const fallback=()=>{const ta=el("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("Select the text and press Cmd+C");}ta.remove();};
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
}
function award(id,on){

  const s=S[id], before=stageDone(s.stage);

}
document.addEventListener("click",ev=>{
  const t=ev.target.closest(".term"), pop=$("#pop");
  if(t){const k=t.dataset.term;pop.innerHTML="<b>"+esc(t.textContent)+"</b>"+esc(WORDS[k]);pop.hidden=false;const r=t.getBoundingClientRect();pop.style.left=Math.max(12,Math.min(r.left+scrollX,scrollX+innerWidth-320))+"px";pop.style.top=(r.bottom+scrollY+8)+"px";ev.stopPropagation();return;}

const HOST="host:climb_agent";
const AGENT={mode:null,info:null,pre:null,login:"",msg:"",connecting:false};
const VERIFY={}, TH={};
let mcpNs=null, sampleFn=null, reconnectTimer=null;
const agentReady=()=>!!AGENT.mode&&!!AGENT.info?.claude&&AGENT.info?.assistantReady!==false;
function scheduleConnection(){
  clearTimeout(reconnectTimer);
  if(isLocal)reconnectTimer=setTimeout(()=>connectAgent(false),AGENT.mode?30000:5000);
}
function connectionChanged(){
  renderRail();syncRunControls();decorateView();renderCompanion();
}
function disconnected(message){
  const changed=!!AGENT.mode;AGENT.mode=null;AGENT.msg=message;scheduleConnection();
  if(changed)connectionChanged();else renderCompanion();
}
function hostMsg(e){
  switch(e&&e.code){
    case "server_not_connected":return "The Claude app on this computer is not running the Climb agent. Use setup steps 3 and 4 instead.";
    case "cancelled":return "You declined the request in the Claude app. You can review it again if you want to continue.";
    case "not_in_manifest":return "The Climb agent is switched off for this page. Turn it on in the page's Permissions menu.";
    case "approval_required":return "Review the request in the Claude app and decide whether the access fits this step.";
    case "tool_error":{const c=e.result&&e.result.content;return (c&&c[0]&&c[0].text)||e.message||"The agent reported a problem.";}
    case "not_granted":case "capability_disabled":case "capability_removed":return "This copy of the guide cannot reach your laptop. Use the copy the Climb agent opens (setup step 4).";
    default:return (e&&e.message)||"The agent did not answer.";
  }
}
async function agentCall(tool,args){
  if(AGENT.mode==="local"){
    const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),tool==="health"?5000:tool==="verify"?60000:20000);
    let r;try{r=await fetch("/api/"+tool,{method:"POST",headers:{"Content-Type":"application/json","X-Climb":"1"},body:JSON.stringify(args||{}),signal:controller.signal});}
    catch(e){const message="The live guide is not answering. Double-click START.command in your Climb folder to start it. This page reconnects on its own.";disconnected(message);throw new Error(message);}
    finally{clearTimeout(timer);}
    const j=await r.json().catch(()=>({error:"The agent sent an unreadable reply."}));
    if(!r.ok){if(r.status===404&&tool==="health"){const message="This page is a preview. Open the live guide to talk to your agent.";disconnected(message);throw new Error(message);}throw new Error(j.error||"The agent reported a problem.");}
    return j;
  }
  if(AGENT.mode==="host"){try{return (await mcpNs.callTool(HOST,tool,args||{},{cache:false})).payload;}catch(e){throw new Error(hostMsg(e));}}
  throw new Error("Connect the Climb agent first (stage 02).");
}
async function connectAgent(fromClick){
  if(AGENT.connecting)return;
  const wasConnected=!!AGENT.mode,wasReady=agentReady();AGENT.connecting=true;AGENT.msg="";if(!wasConnected||fromClick)renderCompanion();
  try{
  if(isLocal){AGENT.mode="local";try{AGENT.info=await agentCall("health");}catch(e){AGENT.mode=null;AGENT.msg=e.message;}}
  else{
    if(!mcpNs&&window.claude&&typeof window.claude.use==="function"){try{mcpNs=await window.claude.use("mcp");}catch(e){mcpNs=null;}}
    if(!fromClick)return;
    if(!mcpNs){AGENT.msg="Open the live guide: double-click START.command in your Climb folder.";renderRail();refreshAgentUi();return;}
    AGENT.mode="host";try{AGENT.info=await agentCall("health");}catch(e){AGENT.mode=null;AGENT.msg=e.message;}
  }
  if(AGENT.mode){
    if(isLocal)restoreSetupMonitors();
    const seed=AGENT.info&&AGENT.info.seed;
    if(seed&&!state.profile&&!Object.keys(state.draft||{}).length&&!pendingImport&&seed.profile){ state.profile=climbClean(seed.profile); if(seed.kind)state.kind=seed.kind;state.courseRepo=repoValue(seed.courseRepo||"");state.useTeamProject=seed.useTeamProject===true; if(ideaText(seed.idea))state.idea=ideaText(seed.idea); for(const k in (seed.done||{}))if(S[k])state.done[k]=true; for(const k in (seed.calls||{}))if(seed.calls[k]===true&&(k==="directionsApplied"||CALLS.some(c=>c.id===k)))state.calls[k]=true; save(); toast("Your answers came across with the agent"); if(current()==="laptop")route(); else location.hash="#laptop"; }
    if(isLocal)["b1","b2","b3","b4"].forEach(k=>state.done[k]=true);
    save(); if(!wasConnected||fromClick){renderRail();refreshAgentUi();checkLaptop(true);}
  } else { renderRail(); refreshAgentUi(); }
  }finally{AGENT.connecting=false;if(!wasConnected||!AGENT.mode||wasReady!==agentReady()||fromClick)connectionChanged();else renderCompanion();scheduleConnection();}
}
addEventListener("online",()=>{if(isLocal)connectAgent(false);});

// A small terminal screen: enough of VT100 for a shell prompt, installers, sign-in prompts and
// simple full-screen programs. Text only; colours and other styling are read and dropped.
function terminalScreen(cols,rows,reply){
  let lines=[""],row=0,col=0,pending="",saved=null,main=null;
  const KEEP=2000;
  const top=()=>Math.max(0,lines.length-rows);
  const line=r=>{while(lines.length<=r)lines.push("");return lines[r];};
  const put=(r,text,at)=>{const old=line(r).padEnd(at," ");lines[r]=old.slice(0,at)+text+old.slice(at+text.length);};
  const clamp=()=>{row=Math.max(top(),Math.min(row,top()+rows-1));col=Math.max(0,Math.min(col,cols-1));line(row);};
  const feed=()=>{row++;line(row);if(lines.length>KEEP){const cut=lines.length-KEEP;lines.splice(0,cut);row-=cut;}};
  function csi(params,final){
    const mark=/^[?>=!<]/.test(params)?params[0]:"",priv=mark==="?",nums=params.replace(/^[?>=!<]/,"").split(";").map(v=>parseInt(v,10)),n=nums[0]>0?nums[0]:1;
    if(mark&&final!=="h"&&final!=="l")return;   // private queries and modes this screen does not have
    switch(final){
      case "A":row-=n;clamp();break;
      case "B":case "e":row+=n;clamp();break;
      case "C":case "a":col+=n;clamp();break;
      case "D":col-=n;clamp();break;
      case "E":row+=n;col=0;clamp();break;
      case "F":row-=n;col=0;clamp();break;
      case "G":case "`":col=n-1;clamp();break;
      case "d":row=top()+n-1;clamp();break;
      case "H":case "f":row=top()+n-1;col=(nums[1]>0?nums[1]:1)-1;clamp();break;
      case "J":{
        const mode=nums[0]||0;
        if(mode===0){lines[row]=line(row).slice(0,col);lines.length=row+1;}
        else if(mode===1){for(let r=top();r<row;r++)lines[r]="";put(row," ".repeat(col+1),0);}
        else{const start=top();for(let r=start;r<lines.length;r++)lines[r]="";if(mode===3){lines=lines.slice(start);row-=start;}}
        break;}
      case "K":{
        const mode=nums[0]||0;

      case "P":{const text=line(row);lines[row]=text.slice(0,col)+text.slice(col+n);break;}
      case "@":{const text=line(row).padEnd(col," ");lines[row]=(text.slice(0,col)+" ".repeat(n)+text.slice(col)).slice(0,cols);break;}
      case "X":put(row," ".repeat(n),col);break;
      case "L":line(row);lines.splice(row,0,...Array(n).fill(""));lines.length=Math.min(lines.length,top()+rows+n);break;
      case "M":lines.splice(row,n);line(row);break;
      case "c":if(reply)reply("\x1b[?1;2c");break;                                   // "what are you?": a plain VT100
      case "n":if(reply&&nums[0]===6)reply("\x1b["+(row-top()+1)+";"+(col+1)+"R");break;   // "where is the cursor?"
      case "s":saved=[row-top(),col];break;
      case "u":if(saved){row=top()+saved[0];col=saved[1];clamp();}break;
      case "h":case "l":
        if(priv&&nums.some(v=>v===1049||v===47||v===1047)){
          if(final==="h"&&!main){main={lines,row,col};lines=[""];row=0;col=0;}
          else if(final==="l"&&main){({lines,row,col}=main);main=null;}
        }
        break;
      default:break; // m (styling) and anything unrecognised
    }
  }
  function write(data){
    let s=pending+data;pending="";
    for(let i=0;i<s.length;i++){
      const c=s[i];
      if(c==="\x1b"){
        const next=s[i+1];
        if(next===undefined){pending=s.slice(i);return;}
        if(next==="["){
          const m=/^\x1b\[([0-9;?>=!<]*)([ -\/]*)([@-~])/.exec(s.slice(i,i+64));
          if(!m){if(s.length-i<64){pending=s.slice(i);return;}continue;}

      }

      else if(c==="\n")feed();
      else if(c==="\b"){if(col>0)col--;}
      else if(c==="\t")col=Math.min(cols-1,(Math.floor(col/8)+1)*8);
      else if(c<" "||c==="\x7f")continue;
      else{
        if(col>=cols){feed();col=0;}
        put(row,c,col);col++;
      }
    }
  }
  return {
    write,
    resize(c,r){cols=c;rows=r;},
    text:()=>lines.map(l=>l.trimEnd()).join("\n").replace(/\n+$/,""),
    view(){ // lines from the top of scrollback, and where the cursor sits among them

    }
  };
}

async function deviceReply(question,context,refs){

      try{

let lessonAudio;
async function soundAnswer(correct){
  if(store("climb-feedback-sound")==="off")return;
  try{
    lessonAudio ||= new AudioContext();
    if(lessonAudio.state==="suspended")await lessonAudio.resume();
    const tone=lessonAudio.createOscillator(),gain=lessonAudio.createGain(),now=lessonAudio.currentTime;
    tone.frequency.setValueAtTime(correct?570:380,now);
    tone.frequency.exponentialRampToValueAtTime(correct?760:285,now+.12);
    gain.gain.setValueAtTime(.0001,now);
    gain.gain.exponentialRampToValueAtTime(.065,now+.015);
    gain.gain.exponentialRampToValueAtTime(.0001,now+.18);
    tone.connect(gain).connect(lessonAudio.destination);tone.start(now);tone.stop(now+.19);
    tone.onended=()=>{tone.disconnect();gain.disconnect();};
  }catch{/* Visual feedback is always available. */}
}

function wordBank(key,draft){
  const lesson=sentencePractice[key], answers=draft.wordBanks ||= {};
  const picks=Array.isArray(answers[key])?answers[key]:[];
  const root=el("div",{class:"word-bank"});
  const line=el("p",{class:"word-line"});
  const rolePrompts={design:"Your walkthrough shows a saved draft on a shared laptop.",dev:"Your test passes, but leaves the draft visible on a shared laptop.",pm:"The crew needs a decision about saving drafts on shared laptops.",lead:"A team asks you to approve saving drafts on shared laptops.",ops:"Two shifts use the same laptop. A draft from the first shift appears for the next."};
  const prompt=key==="human"&&rolePrompts[P().role]?rolePrompts[P().role]+" What should happen before approval?":lesson.prompt;
  root.append(el("p",null,prompt),line);
  const groups=lesson.blanks.map((bank,blank)=>{
    const group=el("div",{class:"word-decision"});
    const options=el("div",{class:"scene-controls",role:"group","aria-label":"Choices for blank "+(blank+1)});
    const note=el("p",{role:"status",class:"answer-verdict"});
    bank.forEach(([label,correct],i)=>{
      const button=el("button",{type:"button",class:"scene-choice"},label);
      button.onclick=()=>{
        picks[blank]=i;
        if(!correct)picks.length=blank+1;
        answers[key]=picks;save();render();soundAnswer(correct);
      };
      options.append(button);
    });
    group.append(options,note);root.append(group);
    return {group,options,note};
  });
  const replay=el("button",{type:"button",class:"btn quiet"},"Try the sentence again");
  replay.onclick=()=>{
    picks.length=0;answers[key]=picks;save();render();
    groups[0].options.firstElementChild.focus();
  };
  root.append(replay);
  function render(){
    line.replaceChildren();
    const pending=lesson.blanks.findIndex((bank,i)=>!bank[picks[i]]?.[1]);
    lesson.parts.forEach((part,i)=>{
      line.append(document.createTextNode(part));
      if(i===lesson.blanks.length)return;
      const picked=lesson.blanks[i][picks[i]];
      const token=el("strong",{class:picked?.[1]?"word-filled":"word-gap"},picked?.[1]?picked[0]:"____");
      if(!picked?.[1])token.setAttribute("aria-label","blank "+(i+1));
      line.append(token);
    });
    groups.forEach(({group,options,note},blank)=>{
      group.hidden=pending!==-1&&blank>pending;
      const choice=lesson.blanks[blank][picks[blank]];
      Array.from(options.children).forEach((button,i)=>button.setAttribute("aria-pressed",String(i===picks[blank])));
      note.hidden=!choice;
      if(choice){
        note.dataset.correct=String(choice[1]);
        note.replaceChildren(el("strong",null,choice[1]?"✓ That fits.":"↺ Try again."),document.createTextNode(" "+choice[2]));
      }else note.replaceChildren();
    });
    replay.hidden=pending!==-1;
  }
  render();
  if(key==="handoff"){
    const sample=el("details",{class:"run-example"},"<summary>See the whole request</summary><p>Check 600 rows in batches of 25. Have one helper check names and another check totals, each in a separate list. Save the last checked row after every batch. Pause if a check fails or a lookup would cost money. When both lists arrive, compare disputed rows with the original invoices. Show me what passed and what still needs my decision.</p>");
    root.append(sample);
  }
  return root;
}

function scrubPersonal(text){
  const p=P(),known=[];
  const add=(value,label)=>{value=String(value||"").trim();if(value.length>=2)known.push([value,label]);};
  for(const repo of [p.repo,state.profile?.repo,state.courseRepo]){add(repo,"[project]");add(String(repo||"").split("/")[1],"[project]");add(String(repo||"").split("/")[0],"[username]");}
  add(AGENT.login,"[username]");add(p.buddyHandle,"[username]");add(p.buddy,"[name]");add(p.name,"[name]");
  add(p.roleText,"[role]");add(p.notes,"[note]");add(state.idea,"[project idea]");
  known.sort((a,b)=>b[0].length-a[0].length);
  let out=String(text||"")
    .replace(/\b(?:gh[pousr]_|github_pat_|sk-)[A-Za-z0-9_-]{8,}/g,"[secret]")
    .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+/g,"[email]")
    .replace(/\bhttps?:\/\/\S+/gi,"[link]")
    .replace(/(?:\/Users\/|\/home\/|[A-Z]:\\Users\\)[^\s\/\\]+/g,"~");
  for(const [value,label] of known)out=out.replace(new RegExp("(^|[^A-Za-z0-9])"+value.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![A-Za-z0-9])","gi"),(m,lead)=>lead+label);
  return out
    .replace(/(^|\s)@[A-Za-z0-9-]{2,39}\b/g,(m,lead)=>lead+"[username]")
    .replace(/\+?\d[\d ().-]{7,}\d/g,"[number]");
}
function feedbackDraft(){
  const p=P(),lines=[],steps=Object.values(S).filter(item=>tier(item)!=="hidden");
  const ROLE={dev:"developer",pm:"product or project manager",design:"designer",ops:"operations, sales or support",lead:"leadership",other:"something else"};
  lines.push("## Who was learning","- Role: "+ROLE[p.role],"- Terminal experience: "+{never:"never opened it",some:"a few times, with help",fluent:"comfortable"}[p.terminal],
    "- Laptop: "+{work:"a Mac used for work",personal:"a Mac also used personally",other:"Windows or Linux"}[p.laptop],
    "- Project: "+(isNew()?"a new project of their own":"an existing project"),"- Guide: "+(isLocal&&AGENT.mode?"live guide"+(AGENT.info?.agent?" "+AGENT.info.agent:""):"file copy"),"","## How far it went");
  for(const st of STAGES){const core=stageSteps(st.id).filter(item=>tier(item)==="core");lines.push("- "+st.name+": "+(stageDone(st.id)?"complete":core.length?core.filter(item=>state.done[item.id]).length+" of "+core.length+" required steps":"not complete"));}
  const open=steps.find(item=>tier(item)==="core"&&!state.done[item.id]);
  if(open)lines.push("- First required step not finished: "+open.title);
  const trouble=[];
  for(const item of steps){
    const runs=(TH[item.id]?.runs||[]).filter(run=>run.mode!=="plan"),bad=runs.filter(run=>["failed","cancelled"].includes(run.status)).length;
    if(bad||runs.length>1)trouble.push("- "+item.title+": "+runs.length+(runs.length===1?" run":" runs")+(bad?", "+bad+" stopped or failed":""));
  }
  if(trouble.length)lines.push("","## Steps that took more than one try in this session",...trouble);
  const asked=[],seen=new Set(),note=(where,text)=>{text=String(text||"").replace(/\s+/g," ").trim().slice(0,240);if(text&&!seen.has(text)){seen.add(text);asked.push("- "+where+": "+text);}};
  for(const item of steps){for(const run of TH["ask:"+item.id]?.runs||[])note("On “"+item.title+"”",run.request?.input);note("On “"+item.title+"”",store("climb-ask-"+item.id));}
  for(const message of COMP.messages.filter(item=>item.role==="user").slice(-12))note("To the chat",message.text);
  if(asked.length)lines.push("","## Questions asked along the way",...asked);
  lines.push("","## What I would change","- ");
  return scrubPersonal(lines.join("\n"));
}
function viewFeedback(v){
  const repo=feedbackRepo();
  v.innerHTML='<div class="stage-head" style="grid-template-columns:minmax(0,1fr)"><div><span class="label">After the climb</span><h1>Suggest improvements</h1></div></div>';
  const box=el("section",{class:"feedback prose","data-repo":repo});
  box.append(el("p",{class:"lead"},"Tell the people who maintain this guide where it helped and where you had to guess. The draft below is built in this browser from how far you got, which steps took more than one try, and the questions you asked."),
    el("p",null,"Your name, usernames, project, idea, file paths, email addresses and links have been replaced with placeholders. <b>Read it before you send it</b>, and delete anything else you would not want other people to see. Nothing leaves this page until you choose to send it."));
  const field=el("div",{class:"field"},'<label for="feedbackText">Your feedback. Edit anything.</label><textarea id="feedbackText" rows="16"></textarea>');
  const text=$("textarea",field);text.value=typeof state.feedbackDraft==="string"?state.feedbackDraft:feedbackDraft();text.oninput=()=>{state.feedbackDraft=text.value;save();};
  const row=el("div",{class:"row"}),status=el("p",{class:"hint",role:"status"});
  const copy=el("button",{class:repo?"btn ghost":"btn",type:"button"},"Copy the text");copy.onclick=()=>copyText(text.value,copy);
  const fresh=el("button",{class:"btn quiet",type:"button"},"Rebuild from my progress");
  fresh.onclick=()=>{delete state.feedbackDraft;save();text.value=feedbackDraft();status.textContent="Rebuilt from your current progress. Your edits were replaced.";};
  if(repo){
    const send=el("button",{class:"btn",type:"button"},"Open a GitHub issue with this text →");
    send.onclick=()=>{
      const clean=scrubPersonal(text.value),long=clean.length>5000;
      if(clean!==text.value){text.value=clean;state.feedbackDraft=clean;save();}
      if(long)copyText(clean,copy);
      window.open("https://github.com/"+repo+"/issues/new?title="+encodeURIComponent("Learner feedback on The Climb")+"&body="+encodeURIComponent(long?clean.slice(0,5000)+"\n\n(Shortened to fit. The full text is on your clipboard; paste it here.)":clean),"_blank","noopener");
      status.textContent="GitHub opened in a new tab. If you are not signed in, it asks you to sign in first, then shows your text filled in. Nothing is posted until you press Submit there.";
    };
    row.append(send,copy,fresh);
    box.append(field,row,status,el("p",{class:"hint"},"GitHub asks you to sign in if you are not already, or to create a free account. The issue is posted from your own GitHub account to "+esc(repo)+". Anyone who can see that repository can read it and see your GitHub username. Prefer not to? Copy the text and send it to the person who gave you this guide."));
  }else{
    row.append(copy,fresh);
    box.append(field,row,status,el("p",{class:"hint"},"Copy the text and send it to the person who gave you this guide."));
  }
  v.append(box,el("div",{class:"pager"},'<a href="#teach"><small>Previous</small>Teach the agent</a><a href="#playbook" style="text-align:right"><small>Keep</small>The playbook</a>'));
}

}
function viewWords(v){

function renderView(keep){
  const v=$("#view"), r=current(), y=scrollY, x=scrollX, focus=keep?fieldFocus(v):null;
  if(!keep){v.style.animation="none";void v.offsetWidth;v.style.animation="";}
  const lesson=focusedLesson();
  document.body.classList.toggle("in-lesson",!!lesson);
  if(lesson)viewLesson(v,lesson);
  else if(!state.profile&&r==="interview")viewInterview(v);
  else if(r==="start"||(!state.profile&&!STAGES.some(stage=>stage.id===r)&&!["words","playbook"].includes(r)))viewStart(v);
  else if(r==="interview"){location.hash="#brief";return;}
  else if(r==="brief")viewBrief(v); else if(r==="feedback")viewFeedback(v); else if(r==="playbook")viewPlaybook(v); else if(r==="words")viewWords(v);
  else if(STAGES.some(s=>s.id===r)){state.last=r;state.begun=true;save();viewStage(v,r,keep);}
  else viewBrief(v);
  const anchor=location.hash.split("/")[1];
  if(anchor?.startsWith("step-")){const fold=document.getElementById(anchor)?.closest("details");if(fold)fold.open=true;}
  decorateView();renderCompanion();if(keep){restoreFieldFocus(focus);scrollTo({left:x,top:y,behavior:"instant"});}
}
function route(){
  if(location.hash.startsWith("#climb-import="))receiveTransfer();
  if(location.hash==="#laptop/section-your-laptop-checked"){checksExpanded=true;history.replaceState(null,"","#laptop/laptop-checks");}
  const stage=current(), target=location.hash.split("/")[1];
  if(target?.startsWith("step-")){
    const step=S[target.slice(5)];
    if(step?.stage===stage&&tier(step)!=="hidden")state.open[stage]=step.id;
  }
  $("#rail").classList.remove("open");renderRail();renderView();renderCompanion();
  const section=target&&Array.from($("#view").querySelectorAll("h2, .intent-workshop h3")).find(h=>sectionKey(h.textContent)===target);
  if(current()==="laptop"||focusedLesson()||$("#view .task-studio")){scrollTo({top:0,behavior:"instant"});($("#view h1")||$("#view h2"))?.focus({preventScroll:true});return;}
  const node=section||(target?.startsWith("step-")&&document.getElementById(target));
  if(node){
    const fold=node.closest("details");if(fold)fold.open=true;
    const focus=node.closest("summary")||node.querySelector("button")||node;
    focus.tabIndex=focus.tabIndex>=0?focus.tabIndex:-1;focus.focus({preventScroll:true});
    node.scrollIntoView({block:"start",behavior:"instant"});
  }else scrollTo({top:0,behavior:"instant"});
}
